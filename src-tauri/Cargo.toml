[package]
name = "storyline"
version = "0.1.0"
description = "Storyline: a local-first desktop app for writing a video game's story"
authors = ["Patrick Simonian"]
license = "Apache-2.0"
repository = "https://github.com/patricksimonian/story-boarder"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
notify = "8.2.0"
