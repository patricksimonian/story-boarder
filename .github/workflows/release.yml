# Builds the Windows installer, signs it when a SignPath project is
# configured, and attaches it to the GitHub release that triggered the run.
#
# Two ways in: publish a release on GitHub (the installer lands on it a
# few minutes later), or run the workflow by hand with a tag to attach an
# installer to a release that already exists — a rerun replaces the file.
#
# Signing is opt-in through repository variables so the workflow runs
# unsigned until the SignPath Foundation application is approved:
#   vars.SIGNPATH_ORGANIZATION_ID, vars.SIGNPATH_PROJECT_SLUG,
#   vars.SIGNPATH_SIGNING_POLICY_SLUG, and secrets.SIGNPATH_API_TOKEN.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to attach the installer to (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: pnpm test:rust

      - name: Build the installer
        run: pnpm tauri build --bundles nsis

      - name: Upload the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: storyline-windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d signed ]; then
            files=$(ls signed/*.exe)
          else
            files=$(ls src-tauri/target/release/bundle/nsis/*.exe)
          fi
          gh release upload "$RELEASE_TAG" $files --clobber
