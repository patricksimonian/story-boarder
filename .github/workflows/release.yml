# Cuts a release and builds the Windows installer for it.
#
# Run it by hand with the version to release. The first job, on Linux,
# moves package.json to that version, folds the changesets under
# .changeset/ into CHANGELOG.md and the release notes, commits, tags
# vX.Y.Z, pushes both, and opens a draft release carrying the notes. The
# second, on Windows, checks out the tag, tests, builds the installer,
# signs it when a SignPath project is configured, writes its SHA-256 to
# SHA256SUMS.txt, has GitHub attest that this workflow built it, attaches
# installer and sums, and publishes the release. A failed build leaves
# the draft and the tag in place; "Re-run failed jobs" picks up from the
# tag.
#
# A download is checked against the sums file, or against the
# attestation with `gh attestation verify <file> --repo <owner>/<repo>`,
# which proves the file came out of this workflow on this repository.
#
# Signing is opt-in through repository variables so the workflow runs
# unsigned until the SignPath Foundation application is approved:
#   vars.SIGNPATH_ORGANIZATION_ID, vars.SIGNPATH_PROJECT_SLUG,
#   vars.SIGNPATH_SIGNING_POLICY_SLUG, and secrets.SIGNPATH_API_TOKEN.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 — package.json is bumped and the tag cut for you'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  cut:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump, write the notes, tag, and open a draft release
        id: cut
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Releases are cut from $DEFAULT_BRANCH; this run is on $GITHUB_REF_NAME."
            exit 1
          fi
          version="${VERSION#v}"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists — pick the next version."
            exit 1
          fi

          # Refuses a version that is not x.y.z or does not move forward, and a release with no changesets.
          node scripts/release.mjs "$version" --notes "$RUNNER_TEMP/notes.md"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md .changeset
          git commit -m "$version"
          git tag "$tag"
          git push origin "HEAD:$GITHUB_REF_NAME" "$tag"

          gh release create "$tag" --draft --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: cut
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.cut.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: pnpm test:rust

      - name: Build the installer
        run: pnpm tauri build --bundles nsis

      - name: Upload the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: story-boarder-windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Gather the installer and write its checksum
        shell: bash
        run: |
          mkdir release
          if [ -d signed ]; then
            cp signed/*.exe release/
          else
            cp src-tauri/target/release/bundle/nsis/*.exe release/
          fi
          # The product name has a space in it, and GitHub turns that into a dot
          # when the asset is uploaded. Name the file that way now, so the sums
          # file names what people actually download.
          for f in release/*.exe; do
            mv "$f" "release/$(basename "$f" | tr ' ' '.')"
          done
          cd release
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest that this workflow built the installer
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.exe

      - name: Attach the installer and its checksum, and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
